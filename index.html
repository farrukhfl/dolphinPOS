<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C79F7" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

    <meta name="description" content="Dolphin POS — the point-of-sale system with built-in dual pricing. Stop absorbing credit card fees and keep more of every sale." />
    <link rel="canonical" href="https://www.dolphinpos.com/" />

    <!--
      Static fallback so bots that don't execute JS (link unfurlers, some
      social scrapers) still get real metadata. src/components/Seo.jsx
      overwrites these per-route once React mounts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dolphin POS" />
    <meta property="og:title" content="Dolphin POS | Point of Sale with Built-In Dual Pricing" />
    <meta property="og:description" content="Dolphin POS — the point-of-sale system with built-in dual pricing. Stop absorbing credit card fees and keep more of every sale." />
    <meta property="og:url" content="https://www.dolphinpos.com/" />
    <meta property="og:image" content="https://www.dolphinpos.com/homepage/hero-banner.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dolphin POS | Point of Sale with Built-In Dual Pricing" />
    <meta name="twitter:description" content="Dolphin POS — the point-of-sale system with built-in dual pricing. Stop absorbing credit card fees and keep more of every sale." />
    <meta name="twitter:image" content="https://www.dolphinpos.com/homepage/hero-banner.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />

    <title>Dolphin POS | Point of Sale with Built-In Dual Pricing</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dolphin POS",
        "url": "https://www.dolphinpos.com/",
        "logo": "https://www.dolphinpos.com/dolphinposlogo.png",
        "email": "support@dolphinpos.com",
        "telephone": "+1-888-696-1049"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
